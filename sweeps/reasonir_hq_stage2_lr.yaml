program: scripts/reasonir_hq_sweep_runner.py
name: reasonir-hq-stage2-lr
method: grid
metric:
  goal: maximize
  name: bright/summary/full_mean
parameters:
  model:
    value: /home/rbw/repo/models/lightonai/ColBERT-Zero/ColBERT-Zero
  dataset_cache_dir:
    value: /tmp/pylate-hf-cache
  bright_cache_dir:
    value: /tmp/pylate-bright-cache
  output_root:
    value: /home/rbw/repo/pylate/output
  stage:
    value: lr
  batch_size:
    value: 2048
  max_steps:
    value: 100
  fp16:
    value: true
  no_bf16:
    value: true
  learning_rate:
    values:
      - !!float 2e-5
      - !!float 5e-5
      - !!float 8e-5
      - !!float 1e-4
  temperature:
    value: 1.0
  validation_size:
    value: 0.01
  warmup_ratio:
    value: 0.1
  mini_batch_size:
    value: 32
  num_workers:
    value: 4
  logging_steps:
    value: 1
  save_steps:
    value: 25
  eval_steps:
    value: 25
  save_total_limit:
    value: 20
  tasks:
    value: biology,economics,robotics,pony
  reasoning:
    value: none
  query_batch_size:
    value: 16
  query_encode_batch_size:
    value: 32
  document_batch_size:
    value: 128
  corpus_chunk_size:
    value: 1024
  top_k:
    value: 1000
command:
  - ${env}
  - uv
  - run
  - python
  - ${program}
  - ${args_no_boolean_flags}
